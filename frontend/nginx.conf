upstream weather_api {
    zone weather_api 64k;
    # Docker DNS keeps the upstream current when Compose recreates the backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location /api/ {
        access_log off;
        # A proxy_pass without a URI preserves the path and query string.
        proxy_pass http://weather_api;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
