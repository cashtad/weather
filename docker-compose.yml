services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}"
      DB_USER: "${DB_USER:?Set DB_USER in .env}"
      DB_PASS: "${DB_PASS:?Set DB_PASS in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:?Set OPENWEATHER_API_KEY in .env}"
      OPENWEATHER_BASE_URL: "${OPENWEATHER_BASE_URL:-https://api.openweathermap.org}"
      OPENWEATHER_CONNECT_TIMEOUT: "${OPENWEATHER_CONNECT_TIMEOUT:-3s}"
      OPENWEATHER_READ_TIMEOUT: "${OPENWEATHER_READ_TIMEOUT:-10s}"
      WEATHER_CACHE_TTL: "${WEATHER_CACHE_TTL:-10m}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
      POSTGRES_USER: "${DB_USER:?Set DB_USER in .env}"
      POSTGRES_PASSWORD: "${DB_PASS:?Set DB_PASS in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
